[package]
name = "cardpeek-desktop"
description = "GPUI desktop frontend for Cardpeek-ng"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cardpeek-analyser = { path = "../cardpeek-analyser" }
cardpeek-app = { path = "../cardpeek-app" }
cardpeek-core = { path = "../cardpeek-core" }
cardpeek-pcsc = { path = "../cardpeek-pcsc" }
cardpeek-replay = { path = "../cardpeek-replay" }
cardpeek-transport = { path = "../cardpeek-transport" }
directories.workspace = true
gpui.workspace = true
rfd.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
image = { version = "0.25.6", default-features = false, features = ["png"] }
x11rb = { version = "0.13.2", default-features = false }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3.23.0"

[[bin]]
name = "cardpeek-desktop"
path = "src/main.rs"

[lints]
workspace = true
