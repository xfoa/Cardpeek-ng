name: Packages and releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate tag and changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", tag):
              raise SystemExit("Release tags must have the form v1.0.0 without suffixes or leading zeroes")
          changelog = Path("docs/changelogs") / f"{tag}.md"
          if not changelog.is_file() or not changelog.read_text(encoding="utf-8").strip():
              raise SystemExit(f"Add a non-empty release changelog at {changelog}")
          manifest = Path("Cargo.toml").read_text(encoding="utf-8")
          match = re.search(r'^\s*version\s*=\s*"([^"]+)"', manifest, re.MULTILINE)
          if match is None or match.group(1) != tag[1:]:
              raise SystemExit("The workspace version must match the release tag without the v prefix")
          print(f"Validated {tag} and {changelog}")
          PY

  deb:
    name: Ubuntu package
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Install native development files
        run: sudo apt-get update && sudo apt-get install --yes libpcsclite-dev pkg-config libgtk-3-dev libxkbcommon-x11-dev dpkg-dev python3
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build Debian package
        run: python3 packaging/build.py deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: cardpeek-ng-deb
          path: dist/packages/*.deb

  rpm:
    name: Alma Linux package
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: ubuntu-latest
    container: almalinux:9
    steps:
      - name: Enable CRB repository
        run: dnf config-manager --set-enabled crb
      - name: Install native development files
        run: dnf install --assumeyes gcc gcc-c++ make pkgconf-pkg-config pcsc-lite-devel gtk3-devel libxkbcommon-x11-devel python3 rpm-build
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --fail https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.100
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build RPM package
        run: python3 packaging/build.py rpm
      - name: Upload RPM package
        uses: actions/upload-artifact@v4
        with:
          name: cardpeek-ng-rpm
          path: dist/packages/*.rpm

  msi:
    name: Windows package
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add WixToolset.UI.wixext/4.0.6
      - name: Build MSI package
        run: python packaging/build.py msi
      - name: Upload MSI package
        uses: actions/upload-artifact@v4
        with:
          name: cardpeek-ng-msi
          path: dist/packages/*.msi

  pkg:
    name: macOS package
    needs: validate
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build macOS package
        run: python3 packaging/build.py pkg
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: cardpeek-ng-pkg
          path: dist/packages/*.pkg

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [validate, deb, rpm, msi, pkg]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: cardpeek-ng-*
          path: dist/release
          merge-multiple: true
      - name: Verify release assets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          packages = list(Path("dist/release").iterdir())
          extensions = {package.suffix for package in packages}
          expected = {".deb", ".rpm", ".msi", ".pkg"}
          if len(packages) != 4 or extensions != expected:
              raise SystemExit(f"Expected one package of each type, found: {packages}")
          print("\n".join(package.name for package in packages))
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/release/* --verify-tag --title "Cardpeek-ng $RELEASE_TAG" --notes-file "docs/changelogs/$RELEASE_TAG.md"
